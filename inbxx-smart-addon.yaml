          # NTC: heater temperature + trend
          - container:
              width: 100%
              height: 18
              y: 70
              pad_all: 0
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "NTC:"
                - label:
                    id: lvgl_lbl_stat_ntc
