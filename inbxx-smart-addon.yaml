    top_layer:
      widgets:
        - obj:
            id: ota_box
            hidden: true
            # Full screen, opaque black: hides page + status row during update
            x: 0
            y: 0
            width: 128
            height: 128
            radius: 0
            pad_all: 0
            border_width: 0
            text_color: white
            bg_color: black
            bg_opa: COVER
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              - label:
                  id: ota_label
                  align: center
                  y: -14
