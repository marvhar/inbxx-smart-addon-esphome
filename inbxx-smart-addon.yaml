# =========================================================================
# INBXX Smart Add-on - ESPHome firmware
# https://github.com/marvhar/inbxx-smart-addon-esphome
#
# Core configuration (adopted by users via the ESPHome dashboard).
# Update / provisioning extras live in inbxx-smart-addon.factory.yaml.
#
# Board: Arduino Nano ESP32 (ESP32-S3, 16 MB flash, octal PSRAM)
# =========================================================================

# ===================== Hardware pins =====================
# PIN_FAN 3
# PIN_ACTION_BUTTON 6
# PIN_BUTTON_PLUS 7
# PIN_BUTTON_MINUS 8
# PIN_PRINT_STATUS 9   // Printer status (M262 P0 B0 (set as output), M264 P0 B1/B0 start/stop print)
# PIN_HEATER 10
# NTC_PIN A7 -> GPIO14

substitutions:
  # Strings
  str_printing: "Printing"
  str_standby: "Standby"
  str_head_setp: "Setpoints"
  str_head_status: "Status"
  str_head_profiles: "Profiles"
  str_mode_1: "Off"
  str_mode_2: "Auto"
  str_mode_3: "Dry"
  str_error_ok: "System OK"
  str_error_start: "System start"
  str_error_sht: "SHT reading Error"
  str_error_ntc: "NTC reading Error"
  str_error_heater: "Heater max. time"
  str_error_overtemp_chamber: "Chamber overtemp."
  str_error_overtemp_heater: "Heater overtemp."
  str_error_heat_no_rise: "Heater no effect"
  str_error_heat_stuck: "Heater stuck on"
  str_error_reset_hint: "Hold to reset"
  str_door_open: "Door open"

  # Safety
  SAFETY_MAX_CHAMBER_TEMP: "60.0"    # SHT4x: chamber shutdown limit (°C)
  SAFETY_MAX_NTC_TEMP: "65.0"        # NTC: heater shutdown limit (°C) - adapt to heater!
  SAFETY_NTC_PLAUSIBLE_MAX: "100.0"  # NTC above = short circuit / sensor fault
  SAFETY_MIN_VALID_TEMP: "10.0"      # below = broken wire / sensor fault
  SAFETY_SENSOR_TIMEOUT_S: "20"      # no new value within this time = sensor fault
  SAFETY_STARTUP_GRACE_S: "30"       # max. time after boot until both sensors must be valid

  # Heater supervision
  SAFETY_HEATER_HIGH_LEVEL: "0.9"    # from this power (0..1) the heater counts as "full on"
  SAFETY_HEATER_MAX_FULL_S: "3600"   # Code 4: max. continuous time at full power (s)
  SAFETY_HEAT_CHECK_S: "180"         # Code 7: after this time at full power the NTC ...
  SAFETY_HEAT_MIN_RISE: "5.0"        #         ... must have risen by at least this many K
  SAFETY_STUCK_DELAY_S: "120"        # Code 8: wait time after heater off (residual heat) ...
  SAFETY_STUCK_RISE: "5.0"           #         ... afterwards NTC must not rise more than this many K
  SAFETY_STUCK_OFFSET: "10.0"        #         ... while NTC is this many K above chamber temp.

  # Heater power limiter (protects bimetal switch KSD9700 70°C, tolerance ±5K)
  HEATER_LIMIT_TEMP: "58.0"          # NTC temperature at which power reaches 0%
  HEATER_LIMIT_BAND: "8.0"           # band below it with linear power reduction (K)
  HEATER_LIMIT_LOOKAHEAD_S: "30.0"   # prediction: T + slope * this time (s)

  # PID Control Values
  PID_KP: "2.8"
  PID_KI: "0.0"                      # leave at 0 because of predictive Limiter!
  PID_KD: "1.5"

  HUM_HYSTERESIS: "3"                # humidity hold: heat above SET_HUM + this value, off below SET_HUM

  # Fan control (fan behind heating element, values 0..1)
  FAN_MIN_HEATING: "0.4"             # min. speed as soon as the heater is on
  FAN_NTC_RAMP_START: "45.0"         # NTC from here: fan ramps up linearly ...
  FAN_NTC_RAMP_END: "55.0"           # ... up to 100% here
  FAN_AFTERRUN_MIN_S: "60"           # min. after-run after heater off (s)
  FAN_AFTERRUN_DELTA: "5.0"          # after-run until NTC < chamber temp. + this many K
  FAN_AFTERRUN_ABS: "40.0"           # after-run NTC limit if SHT is invalid (°C)
  FAN_AFTERRUN_BLIND_S: "180"        # after-run time if NTC is invalid (s)
  FAN_CIRCULATION: "0.25"            # circulation in Auto+printing or Dry

  # Open door detection via SHT4x (mounted at the door)
  DOOR_DROP_K: "2.0"                 # door open: temperature drops by at least this many K ...
  DOOR_DROP_WINDOW_S: "60"           # ... within this time (s, max. 75)
  DOOR_CLOSE_STABLE_S: "120"         # door closed: no new minimum for this many s ...
  DOOR_CLOSE_RISE_K: "0.5"           # ... or temperature this many K above minimum again

  # IOs
  PIN_NTC: GPIO14
  NTC_ref_voltage: 3.3
  PIN_PRINTER_STATUS: GPIO18
  PIN_FAN: GPIO6
  PIN_HEATER: GPIO21
  PIN_BUTTON_PLUS: GPIO10
  PIN_BUTTON_MINUS: GPIO17
  PIN_BUTTON_ACTION: GPIO9
  PIN_NEOPIXEL: GPIO47

  # WS2811 strip: segment 1 (status light) followed by segment 2 (extended light).
  # Both counts are adjustable at runtime (Home Assistant / web UI, 0 = segment
  # not present); the values below are only the defaults for a fresh device.
  NUM_LEDS_MAX: "60"                 # max. LEDs on the bus (segment 1 + segment 2)
  NUM_LEDS_SEG1: "4"                 # default LED count segment 1
  NUM_LEDS_SEG2: "8"                 # default LED count segment 2

  # UI/HA
  MAX_TEMP: 55.0                     # keep >= 5 K below SAFETY_MAX_CHAMBER_TEMP
  MIN_TEMP: 30.0
  MAX_HUM: 100
  MIN_HUM: 20

  SCREEN_OFF_SECONDS: 45
  BOOT_SCREEN_SECONDS: 3             # duration of boot screen (logo) after start

  MIN_DRY_HOURS: "1"
  MAX_DRY_HOURS: "12"
  str_dry_time: "Dry time:"

  # Status LED (segment 1)
  LED_BRIGHTNESS: "0.8"              # brightness 0..1
  MIN_LED_TIMEOUT: "1"               # standby light timeout: adjustable from ... (min)
  MAX_LED_TIMEOUT: "60"              # ... to (min)


globals:
  - id: SET_TEMP
    type: int
    restore_value: true
    initial_value: '40'

  - id: SET_HUM
    type: int
    restore_value: true
    initial_value: '30'

  - id: selected_value
    type: int
    initial_value: '0'

  - id: edit_mode
    type: bool
    initial_value: 'false'

  - id: set_page_edit          # edit_mode currently applies to the setpoints page
    type: bool
    initial_value: 'false'

  - id: profile_1_name
    type: std::string
    restore_value: true
    max_restore_data_length: 10
    initial_value: '"PLA"'

  - id: profile_2_name
    type: std::string
    restore_value: true
    max_restore_data_length: 10
    initial_value: '"ABS"'

  - id: profile_3_name
    type: std::string
    restore_value: true
    max_restore_data_length: 10
    initial_value: '"PETG"'

  - id: profile_1_temp
    type: int
    restore_value: true
    initial_value: '40'

  - id: profile_2_temp
    type: int
    restore_value: true
    initial_value: '55'

  - id: profile_3_temp
    type: int
    restore_value: true
    initial_value: '50'

  - id: profile_1_hum
    type: int
    restore_value: true
    initial_value: '30'

  - id: profile_2_hum
    type: int
    restore_value: true
    initial_value: '30'

  - id: profile_3_hum
    type: int
    restore_value: true
    initial_value: '30'

  - id: error_code
    type: int
    initial_value: '1'  # 0=no Error, 1=StartUp, 2=SHT Error, 3=NTC Error, 4=Heater max. Time, 5=Chamber overtemp, 6=Heater overtemp, 7=Heater no effect, 8=Heater stuck on

  # Safety: timestamp (millis) of the last valid sensor value
  - id: sht_last_update
    type: uint32_t
    initial_value: '0'

  - id: ntc_last_update
    type: uint32_t
    initial_value: '0'

  # Dry: max. duration (h) and elapsed time (min) - survives power loss
  - id: DRY_HOURS
    type: int
    restore_value: true
    initial_value: '6'

  - id: dry_elapsed_min
    type: int
    restore_value: true
    initial_value: '0'

  # Status LED
  - id: LED_TIMEOUT_MIN        # standby light off after x minutes
    type: int
    restore_value: true
    initial_value: '5'

  - id: led_count_seg1         # number of LEDs in segment 1 (status light)
    type: int
    restore_value: true
    initial_value: '${NUM_LEDS_SEG1}'

  - id: led_count_seg2         # number of LEDs in segment 2 (extended light)
    type: int
    restore_value: true
    initial_value: '${NUM_LEDS_SEG2}'

  - id: led_standby_on         # standby light (white) currently active
    type: bool
    initial_value: 'false'

  - id: was_printing           # printer was printing (for "print finished")
    type: bool
    initial_value: 'false'

  - id: print_finished         # print finished, not yet acknowledged -> green
    type: bool
    initial_value: 'false'

  # Door open (detected via fast temperature drop at SHT4x)
  - id: door_open
    type: bool
    initial_value: 'false'

  # System would heat if the door were closed -> door detection only active then
  - id: heat_wanted
    type: bool
    initial_value: 'false'

  # Request: clear door detection history (after acknowledge)
  - id: door_hist_clear
    type: bool
    initial_value: 'false'

  # Humidity hold: heat request with hysteresis
  - id: hum_heat_active
    type: bool
    initial_value: 'false'

  # Safety: current check result (not latched), 0 = all OK
  - id: safety_check_code
    type: int
    initial_value: '1'

  # Safety loop: shared results between its steps (see interval 1s)
  - id: sht_ok                 # SHT4x delivers fresh + plausible values
    type: bool
    initial_value: 'false'

  - id: ntc_ok                 # NTC delivers fresh + plausible values
    type: bool
    initial_value: 'false'

  - id: heater_check_code      # result of heater supervision (0/4/7/8)
    type: int
    initial_value: '0'

  - id: fault_changed          # error_code changed in this cycle
    type: bool
    initial_value: 'false'

  # Safety: power actually output to the heater (0..1)
  - id: heater_level
    type: float
    initial_value: '0.0'

  # Power request of the PID (0..1), before limiting
  - id: heater_request
    type: float
    initial_value: '0.0'

  # Max. power allowed by the NTC limiter (0..1)
  - id: heater_limit
    type: float
    initial_value: '0.0'

  # Smoothed NTC temperature slope (K/s)
  - id: ntc_slope
    type: float
    initial_value: '0.0'

  # Fan: speed actually output (0..1)
  - id: fan_level
    type: float
    initial_value: '0.0'

esphome:
  name: inbxx-smart-addon
  friendly_name: INBXX Smart Add-on
  # Same firmware for all devices -> append MAC address to the name
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      # Clamp restored setpoints to the current limits (MIN/MAX_TEMP may have changed)
      - lambda: |-
          auto clamp_t = [](int v) { return std::min(std::max(v, (int) ${MIN_TEMP}), (int) ${MAX_TEMP}); };
          id(SET_TEMP)       = clamp_t(id(SET_TEMP));
          id(profile_1_temp) = clamp_t(id(profile_1_temp));
          id(profile_2_temp) = clamp_t(id(profile_2_temp));
          id(profile_3_temp) = clamp_t(id(profile_3_temp));
          // Clamp restored LED counts to the bus size (NUM_LEDS_MAX may have changed)
          id(led_count_seg1) = std::min(std::max(id(led_count_seg1), 0), ${NUM_LEDS_MAX});
          id(led_count_seg2) = std::min(std::max(id(led_count_seg2), 0), ${NUM_LEDS_MAX} - id(led_count_seg1));
      # LED bus: always on, the "Render" effect maps both segments onto the strip
      - light.turn_on:
          id: main_led_bus
          brightness: 100%
          effect: Render
      - script.execute: screensaver
      - script.execute: update_labels_page_main
      - script.execute: update_profile_page
      - script.execute: update_labels_page_profile
      - script.execute: update_settings_page
      - script.execute: update_error_display
      - script.execute: update_printer_label
      - delay: ${BOOT_SCREEN_SECONDS}s  # Boot screen: show logo, then reveal the UI
      - lvgl.widget.hide: boot_box

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: gd
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"

logger:
  level: WARN

# Required for Home Assistant and the dashboard import.
# No encryption key in the public config - users get their own on adoption.
api:

ota:
  - platform: esphome
    # Main loop is blocked during OTA -> display is not polled.
    # ota_refresh renders LVGL immediately AND pushes the buffer to the OLED.
    on_begin:
      - lambda: |-
          id(oled_1).turn_on();
          lv_obj_move_foreground(id(ota_box));   // above status row / error box
      - lvgl.resume:
      - lvgl.widget.show: ota_box
      - lvgl.label.update:
          id: ota_label
          text: "Updating..."
      - lvgl.bar.update:
          id: ota_bar
          value: 0
          animated: false
      - script.execute: ota_refresh
    on_progress:
      - lvgl.bar.update:
          id: ota_bar
          value: !lambda return x;
          animated: false
      - lvgl.label.update:
          id: ota_label
          text:
            format: "Updating %.0f%%"
            args: [x]
      - script.execute: ota_refresh
    on_end:
      - lvgl.bar.update:
          id: ota_bar
          value: 100
          animated: false
      - lvgl.label.update:
          id: ota_label
          text: "Done, rebooting"
      - script.execute: ota_refresh
    on_error:
      - lvgl.label.update:
          id: ota_label
          text:
            format: "Failed (err %u)"
            args: [x]
      - script.execute: ota_refresh

# WiFi is provisioned by the user: without credentials the device opens a
# hotspot (named after the device) with a captive portal.
wifi:
  ap:

captive_portal:

web_server:

############### PSRAM ###################################################
#########################################################################
psram:
  mode: octal

############### I2C Bus #################################################
#########################################################################
i2c:
  sda: 11
  scl: 12
  id: i2c_bus_1
  frequency: 400kHz

############### FONTS ###################################################
#########################################################################
font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto_l
    size: 28

  - file: "gfonts://Roboto"
    id: roboto_m
    size: 15
    extras:
      - file: "gfonts://Material+Symbols+Outlined"
        glyphs:
          - "\U0000e5d8"  # arrow_upward (NTC trend on status page)
          - "\U0000e5db"  # arrow_downward

############### IMAGES ##################################################
#########################################################################
image:
  - platform: file
    file: "images/heater1_17x18.bmp"
    id: heater_1
    type: BINARY

  - platform: file
    file: "images/heater2_17x18.bmp"
    id: heater_2
    type: BINARY

  - platform: file
    file: "images/voxel3d_100x65.bmp"
    id: voxel_img
    type: BINARY

  - platform: file
    file: "images/wifi_18x18.bmp"
    id: wifi_on_img
    type: BINARY

  - platform: file
    file: "images/wifi_off_18x18.bmp"
    id: wifi_off_img
    type: BINARY

  - platform: file
    file: "images/FAN_run1_17x18.bmp"
    id: fan_run1
    type: BINARY

  - platform: file
    file: "images/FAN_run2_17x18.bmp"
    id: fan_run2
    type: BINARY

  - platform: file
    file: "images/FAN_still_17x18.bmp"
    id: fan_still
    type: BINARY

############### Display Driver ##########################################
#########################################################################
# SH1107 128x128px
display:
  - platform: ssd1306_i2c
    model: "SH1107 128x128"
    id: oled_1
    auto_clear_enabled: false
    update_interval: 200ms  # needed!! 'never' not working!
    # address: 0x3C

############### LVGL CONFIG, PAGES, WIDGETS #############################
#########################################################################
lvgl:
  - id: lvgl_id
    displays: oled_1
    bg_color: black
    text_color: white
    rotation: 180
    default_font: roboto_m
    pages:
      - id: lvgl_page_main
        scrollbar_mode: "OFF"
        widgets:
          - label:
              id: lvgl_lbl_main_state
              text: "N/A"
              x: 0
              y: 0
              width: 128
              align: TOP_LEFT
              long_mode: SCROLL_CIRCULAR
              text_font: roboto_l

          - label:
              id: lvgl_lbl_main_temp
              text: "Temp.: --,-°C"
              x: 5
              y: 38

          - label:
              id: lvgl_lbl_main_hum
              text: "Hum.: --,-%"
              x: 5
              y: 58

          - container:
              width: 100%
              height: 50
              x: 5
              y: 82
              bg_color: black
              text_color: white
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: START
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "Printer:"
                    width: SIZE_CONTENT

                - label:
                    id: lvgl_lbl_main_pr_st
                    text: "---"
                    flex_grow: 1
                    long_mode: SCROLL_CIRCULAR
                    pad_left: 3

      - id: lvgl_page_set
        scrollbar_mode: "OFF"
        widgets:
          - label:
              text: "${str_head_setp}"
              width: 100%
              align: TOP_LEFT
              long_mode: SCROLL_CIRCULAR
              text_font: roboto_l
              y: 0

          - container:
              width: 100%
              height: 22
              y: 38
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "Temp.:"

                - label:
                    id: temp_value
                    text: !lambda |-
                      return str_sprintf("%d °C", id(SET_TEMP));
                    text_align: RIGHT
                    bg_opa: COVER
                    bg_color: black
                    pad_left: 3
                    pad_right: 3

          - container:
              width: 100%
              height: 22
              y: 60
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "Humid.:"

                - label:
                    id: humidity_value
                    text: !lambda |-
                      return str_sprintf("%d %%", id(SET_HUM));
                    text_align: RIGHT
                    bg_opa: COVER
                    bg_color: black
                    pad_left: 3
                    pad_right: 3

          - container:
              width: 100%
              height: 22
              y: 82
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "${str_dry_time}"

                - label:
                    id: dry_value
                    text: !lambda |-
                      return str_sprintf("%d h", id(DRY_HOURS));
                    text_align: RIGHT
                    bg_opa: COVER
                    bg_color: black
                    pad_left: 3
                    pad_right: 3

      - id: lvgl_page_profiles
        scrollbar_mode: "OFF"
        widgets:
          - label:
              text: "${str_head_profiles}"
              x: 0
              y: 0
              width: 100%
              align: TOP_LEFT
              long_mode: SCROLL_CIRCULAR
              text_font: roboto_l

          - container:
              id: lvgl_cont_profiles_prof1
              width: 100%
              height: 19
              radius: 0
              pad_all: 1
              border_width: !lambda |-
                if (std::string(id(select_act_profile).current_option()) == "Profile 1") {
                  return 1;
                } else {
                  return 0;
                }
              border_color: white
              bg_opa: COVER
              bg_color: black
              text_color: white
              y: 38
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    id: lvgl_lbl_prof1_name
                    text: !lambda |-
                      return id(profile_1_name);
                    width: 33%
                    text_align: LEFT
                    long_mode: SCROLL_CIRCULAR
                - label:
                    id: lvgl_lbl_prof1_temp
                    text: !lambda |-
                      return str_sprintf("%d °C", id(profile_1_temp));
                    text_align: RIGHT
                - label:
                    id: lvgl_lbl_prof1_hum
                    text: !lambda |-
                      return str_sprintf("%d %%", id(profile_1_hum));
                    text_align: RIGHT

          - container:
              id: lvgl_cont_profiles_prof2
              width: 100%
              height: 19
              radius: 0
              pad_all: 1
              border_width: !lambda |-
                if (std::string(id(select_act_profile).current_option()) == "Profile 2") {
                  return 1;
                } else {
                  return 0;
                }
              border_color: white
              bg_opa: COVER
              bg_color: black
              text_color: white
              y: 58
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    id: lvgl_lbl_prof2_name
                    text: !lambda |-
                      return id(profile_2_name);
                    width: 33%
                    text_align: LEFT
                    long_mode: SCROLL_CIRCULAR
                - label:
                    id: lvgl_lbl_prof2_temp
                    text: !lambda |-
                      return str_sprintf("%d °C", id(profile_2_temp));
                    text_align: RIGHT
                - label:
                    id: lvgl_lbl_prof2_hum
                    text: !lambda |-
                      return str_sprintf("%d %%", id(profile_2_hum));
                    text_align: RIGHT

          - container:
              id: lvgl_cont_profiles_prof3
              width: 100%
              height: 19
              radius: 0
              pad_all: 1
              border_width: !lambda |-
                if (std::string(id(select_act_profile).current_option()) == "Profile 3") {
                  return 1;
                } else {
                  return 0;
                }
              border_color: white
              bg_opa: COVER
              bg_color: black
              text_color: white
              y: 78
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    id: lvgl_lbl_prof3_name
                    text: !lambda |-
                      return id(profile_3_name);
                    width: 33%
                    text_align: LEFT
                    long_mode: SCROLL_CIRCULAR
                - label:
                    id: lvgl_lbl_prof3_temp
                    text: !lambda |-
                      return str_sprintf("%d °C", id(profile_3_temp));
                    text_align: RIGHT
                - label:
                    id: lvgl_lbl_prof3_hum
                    text: !lambda |-
                      return str_sprintf("%d %%", id(profile_3_hum));
                    text_align: RIGHT

      # Live values of heater / fan control (updated by update_status_page)
      - id: lvgl_page_status
        scrollbar_mode: "OFF"
        widgets:
          - label:
              text: "${str_head_status}"
              x: 0
              y: 0
              width: 100%
              align: TOP_LEFT
              long_mode: SCROLL_CIRCULAR
              text_font: roboto_l

          # Heater: actual output power
          - container:
              width: 100%
              height: 18
              y: 34
              pad_all: 0
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: SPACE_BETWEEN
                flex_align_cross: CENTER
              widgets:
                - label:
                    text: "Heater:"
                - label:
                    id: lvgl_lbl_stat_heat
