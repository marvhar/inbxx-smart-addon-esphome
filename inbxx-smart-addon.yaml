                    bg_opa: COVER

        - container:
            id: status_row
            hidden: false
            align: bottom_mid
            width: 100%
            height: 20
            outline_width: 1
            outline_color: white
            outline_opa: COVER
            y: 0
            scrollbar_mode: "OFF"
            scrollable: false
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly
              flex_align_track: center
              flex_align_cross: center
            text_color: white
            bg_color: black
            widgets:
              # Fan animation
              - animimg:
                  id: lvgl_img_topl_fan
                  hidden: true
                  src: [fan_run1, fan_run2]
                  image_recolor: white
                  image_recolor_opa: COVER
                  duration: 800ms

              # Still Fan when off
              - image:
                  id: lvgl_img_topl_fan_still
                  src: fan_still
                  image_recolor: white
                  image_recolor_opa: COVER

              # Heater animation
              - animimg:
                  id: lvgl_img_topl_heat
                  hidden: true
                  src: [heater_1, heater_2]
                  image_recolor: white
                  image_recolor_opa: COVER
                  duration: 800ms

              # Still Heater Image when off
              - image:
                  id: lvgl_img_topl_heat_still
                  src: heater_1
                  image_recolor: white
                  image_recolor_opa: COVER

              # Connection: wifi_on = WiFi + HA (API) connected, wifi_off otherwise
              - image:
                  id: lvgl_img_topl_conn_on
                  hidden: true
                  src: wifi_on_img
                  image_recolor: white
                  image_recolor_opa: COVER

              - image:
                  id: lvgl_img_topl_conn_off
                  src: wifi_off_img
                  image_recolor: white
                  image_recolor_opa: COVER

        - obj:
            id: error_box
            hidden: true
            align: center
            width: 124
            height: 100
            text_color: white
            bg_color: black
            border_color: white
            border_width: 1
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "ERROR"
                  align: TOP_MID
              - label:
                  id: lvgl_lbl_error_text
                  text: ""
                  align: CENTER
                  width: 110
                  long_mode: WRAP
                  text_align: CENTER
              - label:
                  text: "${str_error_reset_hint}"
                  align: BOTTOM_MID

        # Boot screen: full-screen logo, last in top_layer = covers everything.
        # Hidden by on_boot after BOOT_SCREEN_SECONDS.
        - obj:
            id: boot_box
            hidden: false
            x: 0
            y: 0
            width: 128
            height: 128
            radius: 0
            pad_all: 0
            border_width: 0
            bg_color: black
            bg_opa: COVER
            scrollbar_mode: "OFF"
            widgets:
              - image:
                  src: voxel_img
                  align: CENTER
                  image_recolor: white
                  image_recolor_opa: COVER
#########################################################################
#########################################################################

############### Sensors #################################################
#########################################################################
sensor:
  - platform: sht4x
    update_interval: 5s
    temperature:
      name: "Temperature"
      id: sht4x_chamber_temp
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: 'if (std::isfinite(x)) id(sht_last_update) = millis();'
          # Door detection: fast temperature drop = open, drop stopped/rising = closed
          - lambda: |-
              if (!std::isfinite(x)) return;
              const uint32_t now = millis();

              // ring buffer of the last 16 values (SHT every 5s -> 80s history)
              static float    buf_t[16];
              static uint32_t buf_ms[16];
              static uint8_t  idx = 0, cnt = 0;
              if (id(door_hist_clear)) { cnt = 0; id(door_hist_clear) = false; }
              buf_t[idx] = x; buf_ms[idx] = now;
              idx = (idx + 1) % 16;
              if (cnt < 16) cnt++;

              static float    door_min = 0.0f;
              static uint32_t door_min_ms = 0;
              const bool prev = id(door_open);

              if (!id(door_open)) {
                // only relevant while the system wants to heat
                if (!id(heat_wanted)) return;
                // peak within window vs. now
                float peak = x;
                for (uint8_t i = 0; i < cnt; i++) {
                  if (now - buf_ms[i] <= ${DOOR_DROP_WINDOW_S} * 1000UL && buf_t[i] > peak) peak = buf_t[i];
                }
                if (peak - x >= ${DOOR_DROP_K}) {
                  id(door_open) = true;
                  door_min = x;
                  door_min_ms = now;
                }
              } else {
                // new minimum only if clearly lower (ignore sensor noise)
                if (x < door_min - 0.1f) { door_min = x; door_min_ms = now; }
                if (x >= door_min + ${DOOR_CLOSE_RISE_K}
                    || now - door_min_ms >= ${DOOR_CLOSE_STABLE_S} * 1000UL) {
                  id(door_open) = false;
                  cnt = 0;   // clear history -> no re-trigger from old peak
                }
              }

              if (prev != id(door_open)) {
                ESP_LOGW("door", "Door %s (T=%.1f)", id(door_open) ? "OPEN" : "closed", x);
                id(door_changed).execute();
              }
          - lvgl.label.update:
              id: lvgl_lbl_main_temp
              text:
                format: "Temp.: %.1f°C"
                args: ['x']

    humidity:
      name: "Relative Humidity"
      id: sht4x_chamber_hum
      accuracy_decimals: 1
      on_value:
        then:
          # Humidity hold: hysteresis, re-evaluate climate mode only on change
          - lambda: |-
              if (!std::isfinite(x)) return;
              const bool prev = id(hum_heat_active);
              if (x > id(SET_HUM) + ${HUM_HYSTERESIS}) {
                id(hum_heat_active) = true;
              } else if (x < id(SET_HUM)) {
                id(hum_heat_active) = false;
              }
              if (prev != id(hum_heat_active)) id(set_climate_mode).execute();
          - lvgl.label.update:
              id: lvgl_lbl_main_hum
              text:
                format: "Hum.: %.1f%%"
                args: ['x']

  - platform: adc
    id: adc_ntc_in
    pin: ${PIN_NTC}
    attenuation: 12db     # full range up to ~3.1V (without: clipping at ~1V)
    update_interval: 500ms
    filters:
      # Drop single outliers (ADC2/WiFi): median of 5 samples,
      # output every 4 samples = every 2s
      - median:
          window_size: 5
          send_every: 4
          send_first_at: 3

  - platform: resistance
    sensor: adc_ntc_in
    configuration: UPSTREAM
    resistor: 10.0kOhm
    reference_voltage: ${NTC_ref_voltage}
    id: ntc_res_sensor

  - platform: ntc
    sensor: ntc_res_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 100kOhm
    name: "Heater Temperature"
    id: ntc_heater_temp
    on_value:
      then:
        - lambda: |-
            static float last_t = NAN;
            static uint32_t last_ms = 0;
            const uint32_t now = millis();
            if (std::isfinite(x)) {
              // Calculate and smooth (EMA) the slope for the limiter prediction
              if (std::isfinite(last_t) && last_ms != 0) {
                const float dt = (now - last_ms) / 1000.0f;
                if (dt > 0.1f) {
                  const float s = (x - last_t) / dt;
                  id(ntc_slope) = 0.7f * id(ntc_slope) + 0.3f * s;
                }
              }
              last_t = x;
              last_ms = now;
              id(ntc_last_update) = now;
            }

  - platform: wifi_signal
    name: "Wifi Signal"
    update_interval: 60s
    icon: mdi:wifi

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    icon: mdi:clock-outline

  # Diagnostics for tuning the heater limiter
  - platform: template
    name: "Heater Power"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:radiator
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(heater_level) * 100.0f;'

  - platform: template
    name: "Heater Limit"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:speedometer-slow
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(heater_limit) * 100.0f;'

  - platform: template
    name: "NTC Slope"
    unit_of_measurement: "K/min"
    accuracy_decimals: 1
    icon: mdi:chart-line
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(ntc_slope) * 60.0f;'

  - platform: template
    name: "Fan Power"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:fan
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(fan_level) * 100.0f;'

  - platform: template
    name: "Dry Remaining"
    id: sens_dry_remaining
    unit_of_measurement: "min"
    accuracy_decimals: 0
    icon: mdi:timer-sand-complete
    update_interval: 60s
    lambda: |-
      if (std::string(id(select_mode).current_option()) != "${str_mode_3}") return 0;
      return std::max(0, id(DRY_HOURS) * 60 - id(dry_elapsed_min));

############### BINARY SENSORS ##########################################
#########################################################################
binary_sensor:
  - platform: template
    name: "Door"
    id: bs_door
    device_class: door
    lambda: 'return id(door_open);'

  - platform: gpio
    pin: ${PIN_PRINTER_STATUS}
    id: input_printer_state
    name: "Input Printer State"
    device_class: running
    on_press:
      then:
        - lambda: |-
            id(was_printing) = true;
            id(print_finished) = false;
        - script.execute: screensaver
        - script.execute: update_printer_label
        - script.execute: set_climate_mode
        - script.execute: update_status_led

    on_release:
      then:
        - lambda: |-
            // only a real print end (not the initial state at boot)
            if (id(was_printing)) id(print_finished) = true;
            id(was_printing) = false;
        - script.execute: screensaver
        - script.execute: update_printer_label
        - script.execute: set_climate_mode
        - script.execute: update_status_led

  - platform: gpio
    pin:
      number: ${PIN_BUTTON_PLUS}
      mode:
        input: true
        pulldown: true
    id: input_bu_plus
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: led_acknowledge
        - if:
            condition:
              - lambda: 'return id(oled_1).is_on();'
              - lambda: 'return id(error_code) == 0;'
            then:
              - script.execute: screensaver
              - if:
                  condition:
                    - lvgl.page.is_showing: lvgl_page_set
                    - lambda: 'return id(edit_mode);'
                  then:
                    - script.execute: value_plus
                  else:
                    - if:
                        condition:
                          - lvgl.page.is_showing: lvgl_page_profiles
                          - lambda: 'return id(edit_mode);'
                        then:
                          - script.execute: profile_up
                          - script.execute: update_profile_page
                        else:
                          - lvgl.page.previous:

            else:
              - script.execute: screensaver

  - platform: gpio
    pin:
      number: ${PIN_BUTTON_MINUS}
      mode:
        input: true
        pulldown: true
    id: input_bu_minus
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: led_acknowledge
        - if:
            condition:
              - lambda: 'return id(oled_1).is_on();'
              - lambda: 'return id(error_code) == 0;'
            then:
              - script.execute: screensaver
              - if:
                  condition:
                    - lvgl.page.is_showing: lvgl_page_set
                    - lambda: 'return id(edit_mode);'
                  then:
                    - script.execute: value_minus
                  else:
                    - if:
                        condition:
                          - lvgl.page.is_showing: lvgl_page_profiles
                          - lambda: 'return id(edit_mode);'
                        then:
                          - script.execute: profile_down
                          - script.execute: update_profile_page
                        else:
                          - lvgl.page.next:

            else:
              - script.execute: screensaver

  - platform: gpio
    pin:
      number: ${PIN_BUTTON_ACTION}
      mode:
        input: true
        pulldown: true
    id: input_bu_action
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: led_acknowledge
    on_multi_click:
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: 'return id(oled_1).is_on();'
              then:
                - script.execute: screensaver
                - if:
                    condition:
                      lambda: 'return id(error_code) >= 2 || id(door_open);'
                    then:
                      # Long press = acknowledge: fault first, then door warning
                      - if:
                          condition:
                            lambda: 'return id(error_code) >= 2;'
                          then:
                            - script.execute: reset_error
                          else:
                            - script.execute: door_reset
                    else:
                      - if:
                          condition:
                            lvgl.page.is_showing: lvgl_page_set
                          then:
                            - lambda: 'id(edit_mode) = !id(edit_mode);'
                            - if:
                                condition:
                                  lambda: 'return !id(edit_mode);'
                                then:
                                  lambda: 'id(selected_value) = 0;'  # Prepare for next usage
                            - script.execute: update_settings_page

                      - if:
                          condition:
                            lvgl.page.is_showing: lvgl_page_profiles
                          then:
                            - lambda: 'id(edit_mode) = !id(edit_mode);'
                            - lambda: |-
                                if (id(edit_mode)) {
                                  const std::string option = std::string(id(select_act_profile).current_option());
                                  if (option == "Profile 1") {
                                      id(selected_value) = 0;
                                  } else if (option == "Profile 2") {
                                      id(selected_value) = 1;
                                  } else if (option == "Profile 3") {
                                      id(selected_value) = 2;
                                  } else {
                                      id(selected_value) = 0;
                                  }
                                }
                            - script.execute: update_profile_page

              else:
                - script.execute: screensaver

      - timing:
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                - lambda: 'return id(oled_1).is_on();'
                - lambda: 'return id(error_code) == 0;'
              then:
                - script.execute: screensaver
                - if:
                    condition:
                      lvgl.page.is_showing: lvgl_page_main
                    then:
                      - script.execute: change_mode
                      - script.execute: update_labels_page_main

                - if:
                    condition:
                      - lambda: 'return id(edit_mode);'
                      - lvgl.page.is_showing: lvgl_page_set
                    then:
                      - lambda: |-
                          // Temp -> Humidity -> Dry time -> Temp
                          id(selected_value) = (id(selected_value) + 1) % 3;
                      - script.execute: update_settings_page

                - if:
                    condition:
                      - lambda: 'return id(edit_mode);'
                      - lvgl.page.is_showing: lvgl_page_profiles
                    then:
                      - lambda: |-
                          auto call = id(select_act_profile).make_call();
                          switch (id(selected_value)) {
                            case 0:
                              call.set_option("Profile 1");
                              break;
                            case 1:
                              call.set_option("Profile 2");
                              break;
                            case 2:
                              call.set_option("Profile 3");
                              break;
                            default:
                              call.set_option("None");
                              break;
                          }
                          call.perform();
                      - script.execute: update_profile_page

              else:
                - script.execute: screensaver

############### BUTTON ##################################################
#########################################################################
button:
  - platform: restart
    name: "Reboot"

  - platform: template
    name: "Reset Error"
    icon: mdi:alert-remove-outline
    on_press:
      - script.execute: reset_error

  - platform: template
    name: "Door Reset"
    icon: mdi:door-closed-lock
    on_press:
      - script.execute: door_reset

############### SELECT ##################################################
#########################################################################
select:
  - platform: template
    name: "System Mode"
    id: select_mode
    optimistic: true
    restore_value: true
    options:
      - '${str_mode_1}'
      - '${str_mode_2}'
      - '${str_mode_3}'
    set_action:
      - script.execute: screensaver
      - lambda: |-
          // Entering Dry -> restart dry timer
          if (x == "${str_mode_3}" && std::string(id(select_mode).current_option()) != "${str_mode_3}") {
            id(dry_elapsed_min) = 0;
          }
          id(select_mode).publish_state(x);
      - script.execute: update_labels_page_main
      - script.execute: set_climate_mode

  # Mode after Dry time has elapsed
  - platform: template
    name: "Dry End Mode"
    id: select_dry_end_mode
    icon: mdi:timer-check-outline
    optimistic: true
    restore_value: true
    initial_option: '${str_mode_2}'
    options:
      - '${str_mode_2}'
      - '${str_mode_1}'

  - platform: template
    name: "Active Profile"
    id: select_act_profile
    restore_value: true
    options:
      - 'Profile 1'
      - 'Profile 2'
      - 'Profile 3'
      - 'None'
    set_action:
      - lambda: |-
          id(select_act_profile).publish_state(x);

          if (x == "Profile 1") {
                id(SET_TEMP) = id(profile_1_temp);
                id(SET_HUM) = id(profile_1_hum);
              }
          if (x == "Profile 2") {
                id(SET_TEMP) = id(profile_2_temp);
                id(SET_HUM) = id(profile_2_hum);
              }
          if (x == "Profile 3") {
                id(SET_TEMP) = id(profile_3_temp);
                id(SET_HUM) = id(profile_3_hum);
              }
      # Same path as everywhere else: target temp + heating mode
      - script.execute: set_climate_mode
      - script.execute: update_profile_page
      - script.execute: update_settings_page  # Update values on setpoints page

############### SWITCH ##################################################
#########################################################################
switch:
  # Auto mode: ON = coupled to printer (print -> SET_TEMP, idle -> hold SET_HUM)
  #            OFF = hold SET_HUM only (printer state ignored)
  - platform: template
    id: sw_ext_control
    name: "Printer Coupling"
    icon: mdi:printer-3d
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: screensaver
        - script.execute: set_climate_mode

    on_turn_off:
      then:
        - script.execute: screensaver
        - script.execute: set_climate_mode

############### OUTPUT ##################################################
#########################################################################
output:
  # Dummy outputs for the virtual LED segment lights (see light: main_led_bus).
  # The lights only provide state/effects; main_led_bus renders them onto the strip.
  - platform: template
    id: out_led_seg1_r
    type: float
    write_action: &led_dummy_write
      - lambda: 'return;'
  - platform: template
    id: out_led_seg1_g
    type: float
    write_action: *led_dummy_write
  - platform: template
    id: out_led_seg1_b
    type: float
    write_action: *led_dummy_write
  - platform: template
    id: out_led_seg2_r
    type: float
    write_action: *led_dummy_write
  - platform: template
    id: out_led_seg2_g
    type: float
    write_action: *led_dummy_write
  - platform: template
    id: out_led_seg2_b
    type: float
    write_action: *led_dummy_write

  - platform: ledc
    pin: ${PIN_FAN}
    id: output_fan_pwm
    frequency: 25kHz
    min_power: 20%
    zero_means_zero: true   # 0 = really off (otherwise min_power)

  - platform: ledc
    pin: ${PIN_HEATER}
    id: output_heater_pwm
    # MOSFET: 250 Hz. < 100 Hz uses a slow LEDC clock path that fails on the
    # ESP32-S3 ("Not yet initialized" -> heater never switched on).
    frequency: 250Hz

  # Safety gate: PID writes here, heater only gets power if no error is active
  - platform: template
    id: output_heater_gate
    type: float
    write_action:
      - lambda: |-
          // PID request is stored; output = min(request, NTC limit), 0 on error.
          // The safety loop re-applies this every second (limit changes faster than PID).
          id(heater_request) = std::isfinite(state) ? state : 0.0f;
          if (id(error_code) != 0) {
            id(heater_level) = 0.0f;
          } else {
            id(heater_level) = std::min(id(heater_request), id(heater_limit));
          }
          id(output_heater_pwm).set_level(id(heater_level));

############### LIGHT ###################################################
#########################################################################
light:
  # Physical WS2811 bus, sized for NUM_LEDS_MAX. It is switched on at boot with
  # the "Render" effect, which copies the current color of the two virtual
  # lights below onto the strip:
  #   LED 0 .. n1-1        -> "Light"          (segment 1, status)
  #   LED n1 .. n1+n2-1    -> "Extended Light" (segment 2)
  #   rest                 -> off
  # n1/n2 come from the "LED Count" numbers, so the layout can change at runtime.
  - platform: esp32_rmt_led_strip
    id: main_led_bus
    channel_colors: RGB
    pin: ${PIN_NEOPIXEL}
    num_leds: ${NUM_LEDS_MAX}
    chipset: WS2811
    internal: true
    restore_mode: ALWAYS_OFF          # switched on with the effect in on_boot
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Render"
          update_interval: 20ms
          lambda: |-
            // Current output of a virtual light (incl. transitions / strobe), gamma is applied by the bus
            auto color_of = [](light::LightState *l) -> Color {
              const auto &v = l->current_values;
              const float s = v.get_state() * v.get_brightness() * 255.0f;
              return Color((uint8_t) (v.get_red() * s + 0.5f),
                           (uint8_t) (v.get_green() * s + 0.5f),
                           (uint8_t) (v.get_blue() * s + 0.5f));
            };
            const int n1 = id(led_count_seg1);
            const int n2 = id(led_count_seg2);
            const Color c1 = color_of(id(led_status));
            const Color c2 = color_of(id(led_extended));
            for (int i = 0; i < it.size(); i++) {
              if (i < n1) {
                it[i] = c1;
              } else if (i < n1 + n2) {
                it[i] = c2;
              } else {
                it[i] = Color::BLACK;
              }
            }

  # Segment 1: status light (controlled by update_status_led)
  - platform: rgb
    name: "Light"
    id: led_status
    red: out_led_seg1_r
    green: out_led_seg1_g
    blue: out_led_seg1_b
    default_transition_length: 300ms
    effects:
      - strobe:
          name: "Error Blink"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
      - strobe:
          name: "Door Blink"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 60%
              blue: 0%
              duration: 800ms
            - state: false
              duration: 800ms

  # Segment 2: extended light (free for the user / Home Assistant)
  - platform: rgb
    name: "Extended Light"
    id: led_extended
    red: out_led_seg2_r
    green: out_led_seg2_g
    blue: out_led_seg2_b

