############### NUMBER ##################################################
#########################################################################
number:
  - platform: template
    name: "LED Standby Timeout"
    id: num_led_timeout
    icon: mdi:timer-outline
    unit_of_measurement: "min"
    mode: box
    step: 1
    min_value: ${MIN_LED_TIMEOUT}
    max_value: ${MAX_LED_TIMEOUT}
    lambda: 'return id(LED_TIMEOUT_MIN);'
    set_action:
      then:
        - lambda: |-
            id(LED_TIMEOUT_MIN) = (int) x;
            id(num_led_timeout).publish_state(x);

  # LED counts per segment (0 = segment not installed). Takes effect immediately.
  - platform: template
    name: "Status LED Count"
    id: num_led_count_seg1
    icon: mdi:led-strip
    entity_category: config
    mode: box
    step: 1
    min_value: 0
    max_value: ${NUM_LEDS_MAX}
    lambda: 'return id(led_count_seg1);'
    set_action:
      then:
        - lambda: |-
            // Segment 1 has priority; shrink segment 2 if the sum would exceed the bus
            id(led_count_seg1) = std::min(std::max((int) x, 0), ${NUM_LEDS_MAX});
            id(led_count_seg2) = std::min(id(led_count_seg2), ${NUM_LEDS_MAX} - id(led_count_seg1));
            id(num_led_count_seg1).publish_state(id(led_count_seg1));
            id(num_led_count_seg2).publish_state(id(led_count_seg2));

  - platform: template
    name: "Extended LED Count"
    id: num_led_count_seg2
    icon: mdi:led-strip-variant
    entity_category: config
    mode: box
    step: 1
    min_value: 0
    max_value: ${NUM_LEDS_MAX}
    lambda: 'return id(led_count_seg2);'
    set_action:
      then:
        - lambda: |-
            // Limited to the LEDs left over after segment 1
            id(led_count_seg2) = std::min(std::max((int) x, 0), ${NUM_LEDS_MAX} - id(led_count_seg1));
            id(num_led_count_seg2).publish_state(id(led_count_seg2));

  - platform: template
    name: "Dry Duration"
