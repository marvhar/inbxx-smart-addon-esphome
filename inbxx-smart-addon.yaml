############### CLIMATE #################################################
#########################################################################
climate:
  - platform: pid
    id: pid_chamber_climate
    name: "Chamber Thermostat"
    sensor: sht4x_chamber_temp
    control_parameters:
      kp: ${PID_KP}
      ki: ${PID_KI}  # leave at 0 because of predictive Limiter!
      kd: ${PID_KD}
    default_target_temperature: 30
    heat_output: output_heater_gate

############################# SCRIPTS ###################################
#########################################################################
script:

  # Turn Screen Off after x time (s)
  #########################################################################
  - id: screensaver
    mode: restart
    then:
      - lambda: id(oled_1).turn_on();
      - script.execute: led_standby_timer    # standby light on together with display
      - delay: ${SCREEN_OFF_SECONDS}s
      - lambda: |-
          id(oled_1).turn_off();
          id(edit_mode) = 0;
          id(selected_value) = 0;
      # Edit mode ended -> redraw all pages so no highlight remains anywhere
      - script.execute: update_labels_page_main
      - script.execute: update_settings_page
      - script.execute: update_profile_page

  # Updating Set-Point Page
  #########################################################################
  - id: update_settings_page
    then:
      # Highlight only while THIS page is being edited
      # (edit_mode/selected_value are shared with the profile page)
      - if:
          condition:
            lvgl.page.is_showing: lvgl_page_set
          then:
            - lambda: 'id(set_page_edit) = id(edit_mode);'
          else:
            - lambda: 'id(set_page_edit) = false;'
      # Temperature
      - lvgl.label.update:
          id: temp_value
          text: !lambda |-
            static char buffer[32];
            snprintf(buffer, sizeof(buffer), "%d °C", id(SET_TEMP));
            return buffer;
          text_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==0 ) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }
          bg_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==0 ) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

      # Humidity
      - lvgl.label.update:
          id: humidity_value
          text: !lambda |-
            static char buffer[32];
            snprintf(buffer, sizeof(buffer), "%d %%", id(SET_HUM));
            return buffer;
          text_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==1 ) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }
          bg_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==1 ) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

      # Dry duration
      - lvgl.label.update:
          id: dry_value
          text: !lambda |-
            static char buffer[16];
            snprintf(buffer, sizeof(buffer), "%d h", id(DRY_HOURS));
            return buffer;
          text_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==2 ) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }
          bg_color: !lambda |-
            if ( id(set_page_edit) && id(selected_value)==2 ) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

    # Update Profile Page
    #########################################################################
  - id: update_profile_page  # selected_value holds the active profile initially (default 0); UP/DOWN changes selected_value - ACTION activates it -> select_act_profile
    then:
      # Profile 1
      - lvgl.container.update:
          id: lvgl_cont_profiles_prof1
          text_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 0) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }

          bg_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 0) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

      # Profile 2
      - lvgl.container.update:
          id: lvgl_cont_profiles_prof2
          text_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 1) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }

          bg_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 1) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

      # Profile 3
      - lvgl.container.update:
          id: lvgl_cont_profiles_prof3
          text_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 2) {
              return lv_color_black();
            } else {
              return lv_color_white();
            }

          bg_color: !lambda |-
            if (id(edit_mode) && id(selected_value) == 2) {
              return lv_color_white();
            } else {
              return lv_color_black();
            }

      - lvgl.container.update:
          id: lvgl_cont_profiles_prof1
          border_width: !lambda |-
            if (std::string(id(select_act_profile).current_option()) == "Profile 1") {
              return 1;
            } else {
              return 0;
            }
      - lvgl.container.update:
          id: lvgl_cont_profiles_prof2
          border_width: !lambda |-
            if (std::string(id(select_act_profile).current_option()) == "Profile 2") {
              return 1;
            } else {
              return 0;
            }
      - lvgl.container.update:
          id: lvgl_cont_profiles_prof3
          border_width: !lambda |-
            if (std::string(id(select_act_profile).current_option()) == "Profile 3") {
              return 1;
            } else {
              return 0;
            }

  #########################################################################
  - id: update_labels_page_profile  # Workaround for updating labels after start
    then:
      - lvgl.label.update:
          id: lvgl_lbl_prof1_name
          text: !lambda |-
            return id(profile_1_name);
      - lvgl.label.update:
          id: lvgl_lbl_prof2_name
          text: !lambda |-
            return id(profile_2_name);
      - lvgl.label.update:
          id: lvgl_lbl_prof3_name
          text: !lambda |-
            return id(profile_3_name);
      - lvgl.label.update:
          id: lvgl_lbl_prof1_temp
          text: !lambda |-
            return str_sprintf("%d °C", id(profile_1_temp));
      - lvgl.label.update:
          id: lvgl_lbl_prof1_hum
          text: !lambda |-
            return str_sprintf("%d %%", id(profile_1_hum));
      - lvgl.label.update:
          id: lvgl_lbl_prof2_temp
          text: !lambda |-
            return str_sprintf("%d °C", id(profile_2_temp));
      - lvgl.label.update:
          id: lvgl_lbl_prof2_hum
          text: !lambda |-
            return str_sprintf("%d %%", id(profile_2_hum));
      - lvgl.label.update:
          id: lvgl_lbl_prof3_temp
          text: !lambda |-
            return str_sprintf("%d °C", id(profile_3_temp));
      - lvgl.label.update:
          id: lvgl_lbl_prof3_hum
          text: !lambda |-
            return str_sprintf("%d %%", id(profile_3_hum));

  # Inc Value
  #########################################################################
  - id: value_plus
    then:
      - lambda: |-
          bool sp_changed = false;   // temp/hum setpoint really changed?
          if (id(selected_value) == 0) {
            if (id(SET_TEMP) < ${MAX_TEMP}) {
              id(SET_TEMP) += 1;
              sp_changed = true;
              }
          } else if (id(selected_value) == 1) {
            if (id(SET_HUM) < ${MAX_HUM}) {
              id(SET_HUM) += 1;
              sp_changed = true;
              }
          } else {
            if (id(DRY_HOURS) < ${MAX_DRY_HOURS}) {
              id(DRY_HOURS) += 1;
              id(num_dry_hours).publish_state(id(DRY_HOURS));
            }
          }
          // Manual setpoint change -> values no longer match a profile
          if (sp_changed && std::string(id(select_act_profile).current_option()) != "None") {
            auto call = id(select_act_profile).make_call();
            call.set_option("None");
            call.perform();
          }
      - script.execute: update_settings_page
      - script.execute: set_climate_mode   # pass new setpoint to PID

  # Dec Value
  #########################################################################
  - id: value_minus
    then:
      - lambda: |-
          bool sp_changed = false;   // temp/hum setpoint really changed?
          if (id(selected_value) == 0) {
            if (id(SET_TEMP) > ${MIN_TEMP}) {
              id(SET_TEMP) -= 1;
              sp_changed = true;
            }
          } else if (id(selected_value) == 1) {
            if (id(SET_HUM) > ${MIN_HUM}) {
              id(SET_HUM) -= 1;
              sp_changed = true;
            }
          } else {
            if (id(DRY_HOURS) > ${MIN_DRY_HOURS}) {
              id(DRY_HOURS) -= 1;
              id(num_dry_hours).publish_state(id(DRY_HOURS));
            }
          }
          // Manual setpoint change -> values no longer match a profile
          if (sp_changed && std::string(id(select_act_profile).current_option()) != "None") {
            auto call = id(select_act_profile).make_call();
            call.set_option("None");
            call.perform();
          }
      - script.execute: update_settings_page
      - script.execute: set_climate_mode   # pass new setpoint to PID

  #########################################################################
  - id: profile_up
    then:
      - lambda: |-
          if (id(selected_value) == 0) {
            // Profile 1 -> 3
            id(selected_value) = 2;
          } else if (id(selected_value) == 1) {
            // Profile 2 -> 1
            id(selected_value) = 0;
          } else if (id(selected_value) == 2) {
            // Profile 3 -> 2
            id(selected_value) = 1;
          } else {
            // None, clear all
            id(selected_value) = 0;
          }

  #########################################################################
  - id: profile_down
    then:
      - lambda: |-
          if (id(selected_value) == 0) {
            // Profile 1 -> 2
            id(selected_value) = 1;
          } else if (id(selected_value) == 1) {
            // Profile 2 -> 3
            id(selected_value) = 2;
          } else if (id(selected_value) == 2) {
            // Profile 3 -> 1
            id(selected_value) = 0;
          } else {
            // None, clear all
            id(selected_value) = 0;
          }

  # Change System-Mode
  #########################################################################
  - id: change_mode
    then:
      - lambda: |-
          // Via make_call so set_action runs (climate mode, dry timer, labels)
          std::string act_mode = std::string(id(select_mode).current_option());
          auto call = id(select_mode).make_call();

          if (act_mode == "${str_mode_1}") {          // Off
            call.set_option("${str_mode_2}");         // to Auto
          } else if (act_mode == "${str_mode_2}") {   // Auto
            call.set_option("${str_mode_3}");         // to Dry
          } else {                                    // Dry
            call.set_option("${str_mode_1}");         // to Off
          }
          call.perform();

  # Update Main Label
  #########################################################################
  - id: update_labels_page_main
    mode: restart
    then:
      - lvgl.label.update:
          id: lvgl_lbl_main_state
          text: !lambda |-
            if (id(door_open)) return std::string("${str_door_open}");
            std::string m = std::string(id(select_mode).current_option());
            if (m == "${str_mode_3}") {
              // Dry: show remaining time h:mm
              int rem = std::max(0, id(DRY_HOURS) * 60 - id(dry_elapsed_min));
              return m + str_sprintf(" %d:%02d", rem / 60, rem % 60);
            }
            return m;

  # Set mode of Climate entity
  #########################################################################
  - id: set_climate_mode
    then:
      - lambda: |-
          std::string act_mode = std::string(id(select_mode).current_option());
          auto call = id(pid_chamber_climate).make_call();
          call.set_target_temperature(id(SET_TEMP));   // SET_TEMP is always the upper limit

          // 0) Re-evaluate humidity hysteresis with the current SET_HUM
          //    (SET_HUM may have changed by profile / buttons / HA since last reading)
          const float hum = id(sht4x_chamber_hum).state;
          if (std::isfinite(hum)) {
            if (hum > id(SET_HUM) + ${HUM_HYSTERESIS}) {
              id(hum_heat_active) = true;
            } else if (hum < id(SET_HUM)) {
              id(hum_heat_active) = false;
            }
          }

          // 1) Would the system heat (ignoring the door)?
          bool wanted = false;
          if (id(error_code) != 0) {                   // Safety: no heating during startup/fault
            wanted = false;
          } else if (act_mode == "${str_mode_1}") {    // Off
            wanted = false;
          } else if (act_mode == "${str_mode_2}") {    // Auto
            if (id(sw_ext_control).state && id(input_printer_state).state) {
              wanted = true;                           // coupled + printing -> SET_TEMP
            } else {
              wanted = id(hum_heat_active);            // otherwise heat only to hold SET_HUM
            }
          } else if (act_mode == "${str_mode_3}") {    // Dry
            wanted = true;
          }
          id(heat_wanted) = wanted;

          // 2) Door warning only relevant while heating is wanted
          if (!wanted && id(door_open)) {
            id(door_open) = false;
            id(door_hist_clear) = true;
            ESP_LOGW("door", "Door warning cleared (no heating wanted)");
            id(update_labels_page_main).execute();
            id(update_status_led).execute();
          }

          // 3) Door open: pause heating
          const bool heat = wanted && !id(door_open);
          call.set_mode(heat ? CLIMATE_MODE_HEAT : CLIMATE_MODE_OFF);
          call.perform();

          ESP_LOGW("climate", "mode=%s err=%d coupling=%d print=%d hum=%.1f/%d humheat=%d door=%d -> %s @ %d C",
                   act_mode.c_str(), id(error_code), (int) id(sw_ext_control).state,
                   (int) id(input_printer_state).state, hum, id(SET_HUM),
                   (int) id(hum_heat_active), (int) id(door_open),
                   heat ? "HEAT" : "OFF", id(SET_TEMP));

  # Acknowledge door warning: door is closed -> resume heating immediately
  #########################################################################
  - id: door_reset
    then:
      - if:
          condition:
            lambda: 'return id(door_open);'
          then:
            - lambda: |-
                id(door_open) = false;
                id(door_hist_clear) = true;
                ESP_LOGW("door", "Door warning acknowledged");
            - script.execute: door_changed

  # OTA screen: render now + flush buffer to OLED (loop is blocked during OTA)
  #########################################################################
  - id: ota_refresh
    then:
      - lambda: |-
          lv_refr_now(NULL);       // LVGL -> display buffer
          id(oled_1).update();     // display buffer -> SH1107 via I2C

  # Status page: heater / limit / NTC (+trend) / fan
  #########################################################################
  - id: update_status_page
    mode: restart
    then:
      - lvgl.label.update:
          id: lvgl_lbl_stat_heat
          text: !lambda 'return str_sprintf("%.0f %%", id(heater_level) * 100.0f);'
      - lvgl.label.update:
          id: lvgl_lbl_stat_limit
          text: !lambda 'return str_sprintf("%.0f %%", id(heater_limit) * 100.0f);'
      - lvgl.label.update:
          id: lvgl_lbl_stat_ntc
          text: !lambda |-
            const float t = id(ntc_heater_temp).state;
            if (!std::isfinite(t)) return std::string("--.- °C");
            // trend arrow from smoothed slope (K/min)
            const float s = id(ntc_slope) * 60.0f;
            const char *arrow = (s > 0.5f) ? "\U0000e5d8" : (s < -0.5f) ? "\U0000e5db" : "";
            return str_sprintf("%s%.1f °C", arrow, t);
      - lvgl.label.update:
          id: lvgl_lbl_stat_fan
          text: !lambda 'return str_sprintf("%.0f %%", id(fan_level) * 100.0f);'

  # Door open/closed changed: pause/resume heating, update display + LED
  #########################################################################
  - id: door_changed
    then:
      - script.execute: screensaver
      - script.execute: set_climate_mode
      - script.execute: update_labels_page_main
      - script.execute: update_status_led

  # Status LED (segment 1) - priority: error > printing > finished > standby
  #########################################################################
  - id: update_status_led
    mode: restart
    then:
      - lambda: |-
          const float b = ${LED_BRIGHTNESS};
          if (id(error_code) >= 2) {
            // Error: red blinking
            auto call = id(led_status).turn_on();
            call.set_effect("Error Blink");
            call.perform();
            return;
          }
          if (id(door_open)) {
            // Door open: yellow blinking
            auto call = id(led_status).turn_on();
            call.set_effect("Door Blink");
            call.perform();
            return;
          }
          float r, g, bl;
          if (id(input_printer_state).state) {
            r = 0.0f; g = 0.0f; bl = 1.0f;          // printing: blue
          } else if (id(print_finished)) {
            r = 0.0f; g = 1.0f; bl = 0.0f;          // print finished: green
          } else if (id(led_standby_on)) {
            r = 1.0f; g = 1.0f; bl = 1.0f;          // standby: white
          } else {
            auto call = id(led_status).turn_off();  // standby timeout: off
            call.perform();
            return;
          }
          auto call = id(led_status).turn_on();
          call.set_effect("None");
          call.set_rgb(r, g, bl);
          call.set_brightness(b);
          call.perform();

  # Standby light: on with display, off after LED_TIMEOUT_MIN
  #########################################################################
  - id: led_standby_timer
    mode: restart
    then:
      - lambda: 'id(led_standby_on) = true;'
      - script.execute: update_status_led
      - delay: !lambda 'return id(LED_TIMEOUT_MIN) * 60000UL;'
      - lambda: 'id(led_standby_on) = false;'
      - script.execute: update_status_led

  # Button press acknowledges "print finished" (green -> standby white)
  #########################################################################
  - id: led_acknowledge
    then:
      - if:
          condition:
            lambda: 'return id(print_finished);'
          then:
            - lambda: 'id(print_finished) = false;'
            - script.execute: update_status_led

  # Update error text sensor + error box on display
  #########################################################################
  - id: update_error_display
    mode: restart
    then:
      - lambda: |-
          std::string msg;
          switch (id(error_code)) {
            case 0:  msg = "${str_error_ok}"; break;
            case 1:  msg = "${str_error_start}"; break;
            case 2:  msg = "${str_error_sht}"; break;
            case 3:  msg = "${str_error_ntc}"; break;
            case 4:  msg = "${str_error_heater}"; break;
            case 5:  msg = "${str_error_overtemp_chamber}"; break;
            case 6:  msg = "${str_error_overtemp_heater}"; break;
            case 7:  msg = "${str_error_heat_no_rise}"; break;
            case 8:  msg = "${str_error_heat_stuck}"; break;
            default: msg = "Unknown error"; break;
          }
          id(txt_system_error).publish_state(msg);
      - lvgl.label.update:
          id: lvgl_lbl_error_text
          text: !lambda 'return id(txt_system_error).state;'
      - if:
          condition:
            lambda: 'return id(error_code) >= 2;'
          then:
            - lvgl.widget.show: error_box
          else:
            - lvgl.widget.hide: error_box
      - script.execute: update_status_led

  # Status row: animated icon while fan/heater is running, still icon otherwise
  #########################################################################
  - id: update_status_icons
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(fan_level) > 0.0f;'
          then:
            - lvgl.widget.hide: lvgl_img_topl_fan_still
            - lvgl.widget.show: lvgl_img_topl_fan
          else:
            - lvgl.widget.hide: lvgl_img_topl_fan
            - lvgl.widget.show: lvgl_img_topl_fan_still
      - if:
          condition:
            lambda: 'return id(heater_level) > 0.0f;'
          then:
            - lvgl.widget.hide: lvgl_img_topl_heat_still
            - lvgl.widget.show: lvgl_img_topl_heat
          else:
            - lvgl.widget.hide: lvgl_img_topl_heat
            - lvgl.widget.show: lvgl_img_topl_heat_still

  # Main page: printer status label (on change + at boot)
  #########################################################################
  - id: update_printer_label
    mode: restart
    then:
      - lvgl.label.update:
          id: lvgl_lbl_main_pr_st
          text: !lambda |-
            return id(input_printer_state).state ? std::string("${str_printing}")
                                                 : std::string("${str_standby}");

  # Status row: connection icon (WiFi + HA API)
  #########################################################################
  - id: update_conn_icon
    mode: restart
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - api.connected:
          then:
            - lvgl.widget.hide: lvgl_img_topl_conn_off
            - lvgl.widget.show: lvgl_img_topl_conn_on
          else:
            - lvgl.widget.hide: lvgl_img_topl_conn_on
            - lvgl.widget.show: lvgl_img_topl_conn_off

  # Copy the values of the active profile into SET_TEMP / SET_HUM
  # (called after a profile value was changed in HA)
  #########################################################################
  - id: apply_active_profile
    then:
      - lambda: |-
          const std::string p = std::string(id(select_act_profile).current_option());
          if (p == "Profile 1") {
            id(SET_TEMP) = id(profile_1_temp); id(SET_HUM) = id(profile_1_hum);
          } else if (p == "Profile 2") {
            id(SET_TEMP) = id(profile_2_temp); id(SET_HUM) = id(profile_2_hum);
          } else if (p == "Profile 3") {
            id(SET_TEMP) = id(profile_3_temp); id(SET_HUM) = id(profile_3_hum);
          }
      - script.execute: set_climate_mode
      - script.execute: update_settings_page

  # Acknowledge fault - only possible if all checks are currently OK
  #########################################################################
  - id: reset_error
    then:
      - if:
          condition:
            lambda: 'return id(error_code) >= 2 && id(safety_check_code) == 0;'
          then:
            - lambda: 'id(error_code) = 0;'
            - script.execute: update_error_display
            - script.execute: set_climate_mode

############################# SAFETY ####################################
#########################################################################
interval:
  # Status page: refresh live values only while visible and display on
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: lvgl_page_status
              - lambda: 'return id(oled_1).is_on();'
          then:
            - script.execute: update_status_page

  # Connection monitor (WiFi + HA API) - independent of the safety loop
  - interval: 2s
    then:
      - lambda: |-
          static int prev_conn = -1;
          const int conn = (wifi::global_wifi_component->is_connected()
                            && api::global_api_server->is_connected()) ? 1 : 0;
          if (conn != prev_conn) {
            prev_conn = conn;
            id(update_conn_icon).execute();
          }

  # Dry timer: count minutes, switch to end mode when elapsed
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return std::string(id(select_mode).current_option()) == "${str_mode_3}";'
          then:
            - lambda: |-
                id(dry_elapsed_min) += 1;
                if (id(dry_elapsed_min) >= id(DRY_HOURS) * 60) {
                  const std::string end_mode = std::string(id(select_dry_end_mode).current_option());
                  ESP_LOGI("dry", "Dry time elapsed -> %s", end_mode.c_str());
                  auto call = id(select_mode).make_call();
                  call.set_option(end_mode);
                  call.perform();
                }
            - script.execute: update_labels_page_main
            - component.update: sens_dry_remaining

  # ======================================================================
  # SAFETY / CONTROL LOOP (1 s)
  # Runs as a fixed sequence of steps every second. Results that later
  # steps need are passed on via globals (sht_ok, ntc_ok,
  # heater_check_code, fault_changed). Order matters: validate sensors ->
  # supervise heater -> latch faults -> drive heater -> drive fan -> UI.
  # ======================================================================
  - interval: 1s
    then:
      # --- Step 1: Sensor validation --------------------------------------
      # Both temperature sensors must deliver fresh (< timeout), finite and
      # plausible values. Also checks the hard over-temperature limits.
      # Output: sht_ok, ntc_ok, safety_check_code (momentary, not latched;
      # used by reset_error to decide whether a reset is allowed).
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t timeout_ms = ${SAFETY_SENSOR_TIMEOUT_S} * 1000UL;
          const float t_sht = id(sht4x_chamber_temp).state;
          const float t_ntc = id(ntc_heater_temp).state;

          id(sht_ok) = id(sht_last_update) != 0
              && (now - id(sht_last_update)) < timeout_ms
              && std::isfinite(t_sht)
              && t_sht > ${SAFETY_MIN_VALID_TEMP};
          id(ntc_ok) = id(ntc_last_update) != 0
              && (now - id(ntc_last_update)) < timeout_ms
              && std::isfinite(t_ntc)
              && t_ntc > ${SAFETY_MIN_VALID_TEMP}
              && t_ntc < ${SAFETY_NTC_PLAUSIBLE_MAX};

          int code = 0;
          if (!id(sht_ok))                              code = 2;  // SHT error
          else if (!id(ntc_ok))                         code = 3;  // NTC error
          else if (t_sht >= ${SAFETY_MAX_CHAMBER_TEMP}) code = 5;  // chamber overtemp
          else if (t_ntc >= ${SAFETY_MAX_NTC_TEMP})     code = 6;  // heater overtemp
          id(safety_check_code) = code;

      # --- Step 2: Heater supervision (time based) ------------------------
      # Watches the heater over time (needs valid sensors):
      # Code 4 = full power for too long
      # Code 7 = full power but NTC does not rise (heater defect / NTC detached)
      # Code 8 = heater off but NTC keeps rising above chamber (MOSFET stuck)
      # Output: heater_check_code (0 = OK).
      - lambda: |-
          static uint32_t full_since = 0;      // start of continuous high power
          static float    full_start_ntc = NAN;
          static uint32_t off_since = 0;       // start of heater off
          static float    off_min_ntc = NAN;   // lowest NTC after residual-heat delay

          const uint32_t now = millis();
          const float t_sht = id(sht4x_chamber_temp).state;
          const float t_ntc = id(ntc_heater_temp).state;
          const float lvl = id(heater_level);
          int heat_code = 0;

          if (!id(sht_ok) || !id(ntc_ok)) {
            full_since = 0;
            off_since = 0;
          } else if (lvl >= ${SAFETY_HEATER_HIGH_LEVEL}) {      // full power
            off_since = 0;
            if (full_since == 0) { full_since = now; full_start_ntc = t_ntc; }
            const uint32_t dur = now - full_since;
            if (dur > ${SAFETY_HEATER_MAX_FULL_S} * 1000UL) {
              heat_code = 4;
            } else if (dur > ${SAFETY_HEAT_CHECK_S} * 1000UL
                       && (t_ntc - full_start_ntc) < ${SAFETY_HEAT_MIN_RISE}
                       && t_ntc < (${SAFETY_MAX_NTC_TEMP} - 10.0f)) {
              heat_code = 7;
            }
          } else if (lvl <= 0.0f) {                              // heater off
            full_since = 0;
            if (off_since == 0) { off_since = now; off_min_ntc = NAN; }
            if (now - off_since > ${SAFETY_STUCK_DELAY_S} * 1000UL) {
              if (!std::isfinite(off_min_ntc) || t_ntc < off_min_ntc) off_min_ntc = t_ntc;
              if ((t_ntc - off_min_ntc) > ${SAFETY_STUCK_RISE}
                  && t_ntc > (t_sht + ${SAFETY_STUCK_OFFSET})) {
                heat_code = 8;
              }
            }
          } else {                                               // partial power = normal regulation
            full_since = 0;
            off_since = 0;
          }
          id(heater_check_code) = heat_code;

      # --- Step 3: Fault latching -----------------------------------------
      # Combines step 1 + 2 (sensor faults have priority). During startup
      # (code 1) waits until all checks pass or the grace time expires.
      # A fault stays latched until reset_error. Output: error_code,
      # fault_changed (true if error_code changed in this cycle).
      - lambda: |-
          const uint32_t now = millis();
          const int code = id(safety_check_code);
          const int new_code = (code != 0) ? code : id(heater_check_code);

          id(fault_changed) = false;
          if (id(error_code) == 1) {                             // startup
            if (new_code == 0) {
              id(error_code) = 0;
              id(fault_changed) = true;
            } else if (now > ${SAFETY_STARTUP_GRACE_S} * 1000UL) {
              id(error_code) = new_code;
              id(fault_changed) = true;
            }
          } else if (id(error_code) == 0 && new_code != 0) {     // new fault
            id(error_code) = new_code;
            id(fault_changed) = true;
            ESP_LOGE("safety", "FAULT %d - heater disabled (T_sht=%.1f, T_ntc=%.1f, lvl=%.2f)",
                     new_code, id(sht4x_chamber_temp).state, id(ntc_heater_temp).state,
                     id(heater_level));
          }

      # --- Step 4: Heater output (limiter + hard shutdown) ----------------
      # Limiter protects the KSD9700 bimetal switch: predicts the NTC
      # temperature (rising slope only) and reduces max. power linearly
      # within HEATER_LIMIT_BAND below HEATER_LIMIT_TEMP.
      # Output = min(PID request, limit); on any fault: hard OFF every cycle.
      - lambda: |-
          if (id(ntc_ok)) {
            const float t_ntc = id(ntc_heater_temp).state;
            const float pred = t_ntc + std::max(0.0f, id(ntc_slope)) * ${HEATER_LIMIT_LOOKAHEAD_S};
            const float lim = (${HEATER_LIMIT_TEMP} - pred) / ${HEATER_LIMIT_BAND};
            id(heater_limit) = std::min(1.0f, std::max(0.0f, lim));
          } else {
            id(heater_limit) = 0.0f;
          }

          if (id(error_code) != 0) {
            id(heater_level) = 0.0f;
            id(output_heater_pwm).set_level(0.0f);
            if (id(pid_chamber_climate).mode != CLIMATE_MODE_OFF) {
              auto call = id(pid_chamber_climate).make_call();
              call.set_mode(CLIMATE_MODE_OFF);
              call.perform();
            }
          } else {
            id(heater_level) = std::min(id(heater_request), id(heater_limit));
            id(output_heater_pwm).set_level(id(heater_level));
          }

      # --- Step 5: Fan control --------------------------------------------
      # Highest of all requests wins:
      #   heating (min speed + proportional to heater power), NTC ramp,
      #   after-run (remove residual heat), full speed on heat-related
      #   faults, circulation (Auto+printing or Dry, door closed).
      - lambda: |-
          static uint32_t last_heat_ms = 0;      // last time the heater was on
          const uint32_t now = millis();
          const float t_sht = id(sht4x_chamber_temp).state;
          const float t_ntc = id(ntc_heater_temp).state;
          const float FAN_MIN  = ${FAN_MIN_HEATING};
          const float FAN_CIRC = ${FAN_CIRCULATION};
          const int err = id(error_code);
          float fan = 0.0f;

          if (id(heater_level) > 0.0f) last_heat_ms = now;

          // Heating: min speed, rising with heater power
          if (id(heater_level) > 0.0f) {
            fan = std::max(fan, FAN_MIN + (1.0f - FAN_MIN) * id(heater_level));
          }

          // NTC ramp: cools the heater -> limiter allows more power
          if (id(ntc_ok)) {
            const float r = (t_ntc - ${FAN_NTC_RAMP_START}) / (${FAN_NTC_RAMP_END} - ${FAN_NTC_RAMP_START});
            fan = std::max(fan, std::min(1.0f, std::max(0.0f, r)));
          }

          // After-run: remove residual heat after the heater switched off
          if (id(heater_level) <= 0.0f && last_heat_ms != 0) {
            const uint32_t since = now - last_heat_ms;
            bool run;
            if (!id(ntc_ok)) {
              run = since < ${FAN_AFTERRUN_BLIND_S} * 1000UL;      // blind: fixed time
            } else {
              const float ref = id(sht_ok) ? (t_sht + ${FAN_AFTERRUN_DELTA}) : ${FAN_AFTERRUN_ABS};
              run = since < ${FAN_AFTERRUN_MIN_S} * 1000UL || t_ntc > ref;
            }
            if (run) fan = std::max(fan, FAN_MIN);
          } else if (id(ntc_ok) && id(sht_ok) && t_ntc > t_sht + 15.0f) {
            fan = std::max(fan, FAN_MIN);       // hot heater, no history (e.g. after reboot)
          }

          // Heat-related faults: full speed
          if (err == 5 || err == 6 || err == 8) fan = 1.0f;

          // Circulation: Auto + printing, or Dry (no fault, door closed)
          if (err == 0 && !id(door_open)) {
            const std::string m = std::string(id(select_mode).current_option());
            if ((m == "${str_mode_2}" && id(input_printer_state).state) || m == "${str_mode_3}") {
              fan = std::max(fan, FAN_CIRC);
            }
          }

          id(fan_level) = std::min(1.0f, fan);
          id(output_fan_pwm).set_level(id(fan_level));

      # --- Step 6: Status row icons ---------------------------------------
      # Fan / heater icons are only redrawn when their on/off state changes.
      - lambda: |-
          static int prev_icons = -1;
          const int icons = (id(fan_level) > 0.0f ? 1 : 0) | (id(heater_level) > 0.0f ? 2 : 0);
          if (icons != prev_icons) {
            prev_icons = icons;
            id(update_status_icons).execute();
          }

      # --- Step 7: React to fault state changes ---------------------------
      # New fault: show error box + wake display.
      # Startup finished / fault cleared: restore the heating mode.
      - if:
          condition:
            lambda: 'return id(fault_changed);'
          then:
            - script.execute: update_error_display
            - if:
                condition:
                  lambda: 'return id(error_code) >= 2;'
                then:
                  - script.execute: screensaver
                else:
                  - script.execute: set_climate_mode
